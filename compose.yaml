services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_DB: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aegis-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD}@db:5432/aegis
      DEMO_USERNAME: ${DEMO_USERNAME:-analyst}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD to at least 12 characters}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  aegis-db:
